name = "dotfiles-gateway"
main = "build/index.js"
compatibility_date = "2026-05-30"

[build]
# worker-build is installed by CI (.github/workflows/deploy.yml); installing it
# again here pulled a second, possibly different version on every build
command = "worker-build --release"

[[routes]]
pattern = "arch.hoangvangioi.com"
custom_domain = true
