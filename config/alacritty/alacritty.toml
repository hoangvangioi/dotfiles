# Window
[window]
padding = { x = 9, y = 9 }
dynamic_padding = true
opacity = 0.92
decorations = "full"
startup_mode = "Windowed"
dynamic_title = true
title = "Alacritty"

# Scrolling
[scrolling]
history = 10000
multiplier = 3

# Font
[font]
size = 8
offset = { x = 0, y = 1 }

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

# Cursor
[cursor]
style = { shape = "Beam", blinking = "Off" }
blink_interval = 500
unfocused_hollow = true
thickness = 0.15

# Colors copied from the supplied palette only.
[colors.primary]
background = "#282a36"
foreground = "#f8f8f2"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#282a36"
cursor = "#f8f8f2"

[colors.vi_mode_cursor]
text = "CellBackground"
cursor = "CellForeground"

[colors.selection]
text = "CellForeground"
background = "#44475a"

[colors.normal]
black   = "#21222c"
red     = "#ff5555"
green   = "#50fa7b"
yellow  = "#f1fa8c"
blue    = "#bd93f9"
magenta = "#ff79c6"
cyan    = "#8be9fd"
white   = "#f8f8f2"

[colors.bright]
black   = "#6272a4"
red     = "#ff6e6e"
green   = "#69ff94"
yellow  = "#ffffa5"
blue    = "#d6acff"
magenta = "#ff92df"
cyan    = "#a4ffff"
white   = "#ffffff"

[colors.search.matches]
foreground = "#44475a"
background = "#50fa7b"

[colors.search.focused_match]
foreground = "#44475a"
background = "#ffb86c"

[colors.footer_bar]
background = "#282a36"
foreground = "#f8f8f2"

[colors.hints.start]
foreground = "#282a36"
background = "#f1fa8c"

[colors.hints.end]
foreground = "#f1fa8c"
background = "#282a36"

# Bell
[bell]
animation = "EaseOutExpo"
duration = 100
color = "#44475a"

# Mouse and selection
[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

# URL hints
[[hints.enabled]]
regex = "(https?|ftp|file)://[^\\s]+"
hyperlinks = true
command = "xdg-open"
post_processing = true
persist = false

[hints.enabled.mouse]
enabled = true

[hints.enabled.binding]
key = "O"
mods = "Control|Shift"

# Keyboard shortcuts
[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "F"
mods = "Control|Shift"
action = "SearchForward"

[[keyboard.bindings]]
key = "Return"
mods = "Control|Shift"
action = "CreateNewWindow"

# Keep OSC 52 clipboard access enabled for remote shells and tmux.
[terminal]
osc52 = "CopyPaste"