# Picom for i3/X11 — Dracula palette, modest shadows and light blur.
# GLX is the practical default here; EGL can be tested on your driver if needed.
backend = "glx";
vsync = true;

# Shadows: soft enough to separate floating dialogs without muddying the gaps.
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.42;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-color = "#1e1f29";
shadow-exclude = [
  "class_g = 'Dunst'",
  "class_g = 'Polybar'",
  "class_g = 'i3-frame'",
  "class_g = 'slop'",
  "class_g = 'flameshot'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE *= '_NET_WM_STATE_HIDDEN'",
  "fullscreen"
];

# Visible but restrained transparency by default. Inactive windows are a little
# more transparent; explicit rules below tune common apps independently.
active-opacity = 0.96;
inactive-opacity = 0.92;
inactive-opacity-override = true;
inactive-dim = 0.04;
inactive-dim-fixed = true;
detect-client-opacity = true;
opacity-rule = [
  "96:class_g = 'Alacritty' && focused",
  "90:class_g = 'Alacritty' && !focused",
  "95:class_g = 'Code'",
  "100:class_g = 'firefox'",
  "96:class_g = 'nemo'",
  "96:class_g = 'Zathura'",
  "100:class_g = 'Pavucontrol'",
  "96:class_g = 'CopyQ'",
  "100:class_g = 'Rofi'",
  "100:class_g = 'Polybar'"
];
frame-opacity = 1.0;

# Blur only the translucent terminal background; keep menus and notifications crisp.
blur = {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = false;
  background-fixed = false;
};
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'notification'",
  "class_g = 'Dunst'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'CopyQ'",
  "class_g = 'Pavucontrol'",
  "class_g = 'slop'",
  "class_g = 'flameshot'",
  "class_g = 'i3-frame'"
];

# Rounded corners for app windows, but not bars, desktop or fullscreen content.
corner-radius = 8;
detect-rounded-corners = true;
rounded-corners-exclude = [
  "fullscreen",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'slop'",
  "class_g = 'flameshot'"
];

# Gentle open/close transitions.
fading = true;
fade-delta = 8;
fade-in-step = 0.06;
fade-out-step = 0.06;
no-fading-openclose = false;
no-fading-destroyed-argb = true;
fade-exclude = [
  "class_g = 'slop'",
  "class_g = 'flameshot'"
];

# Per-window-type defaults. Dunst notifications are kept opaque and shadow-free.
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.96; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; fade = false; };
  popup_menu = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
  notification = { shadow = false; fade = true; opacity = 1.0; };
  utility = { shadow = true; };
};

# Focus and window-type detection.
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-transient = true;
detect-client-leader = true;

# Let fullscreen applications bypass compositing; disable if video flickers.
unredir-if-possible = true;
log-level = "warn";