# Yazi theme - Dracula palette (https://draculatheme.com/contribute)
# Notes:
#   * `[flavor]` and the dark/light specific parts live in the preset; setting
#     them here would pin yazi to one variant, so they are intentionally absent.
#   * Sections that are not mentioned keep their upstream defaults.

[app]
overall = { fg = "#f8f8f2", bg = "#282a36" }

# File states: magenta selection / reversed cursor, Dracula "comment" for hidden
[filetype]
rules = [
	# Image
	{ mime = "**/image/*", fg = "#f1fa8c" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#ff79c6" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff5555" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#8be9fd" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#6272a4" },
	# Special file
	{ url = "*", is = "orphan", bg = "#ff5555" },
	{ url = "*", is = "exec"  , fg = "#50fa7b" },
	# Dummy file
	{ url = "*", is = "dummy", bg = "#ff5555" },
	{ url = "*", is = "dummy", fg = "#f8f8f2" },
	{ url = "*/", is = "dummy", bg = "#ff5555" },
	{ url = "*/", is = "dummy", fg = "#f8f8f2" },
	# Fallback
	{ url = "*/", fg = "#8be9fd" },
]

[mgr]
cwd = { fg = "#8be9fd" }

# Find
find_keyword  = { fg = "#f1fa8c", bold = true, italic = true, underline = true }
find_position = { fg = "#ff79c6", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { italic = true }

# Marker
marker_copied   = { fg = "#50fa7b", bg = "#50fa7b" }
marker_cut      = { fg = "#ff5555", bg = "#ff5555" }
marker_marked   = { fg = "#8be9fd", bg = "#8be9fd" }
marker_selected = { fg = "#f1fa8c", bg = "#f1fa8c" }
marker_symbol   = "▐"

# Count
count_copied   = { fg = "#f8f8f2", bg = "#50fa7b" }
count_cut      = { fg = "#f8f8f2", bg = "#ff5555" }
count_selected = { fg = "#282a36", bg = "#f1fa8c" }

# Border
border_symbol = "│"
border_style  = { fg = "#6272a4" }

[tabs]
active   = { fg = "#282a36", bg = "#8be9fd", bold = true }
inactive = { fg = "#6272a4", bg = "#44475a" }

[mode]
normal_main = { fg = "#282a36", bg = "#8be9fd", bold = true }
normal_alt  = { fg = "#8be9fd", bg = "#44475a", bold = true }

select_main = { fg = "#282a36", bg = "#ff79c6", bold = true }
select_alt  = { fg = "#ff79c6", bg = "#44475a", bold = true }

unset_main = { fg = "#282a36", bg = "#ff5555", bold = true }
unset_alt  = { fg = "#ff5555", bg = "#44475a", bold = true }

[status]
perm_sep   = { fg = "#6272a4" }
perm_type  = { fg = "#50fa7b" }
perm_read  = { fg = "#f1fa8c" }
perm_write = { fg = "#ff5555" }
perm_exec  = { fg = "#8be9fd" }

progress_label  = { bold = true }
progress_normal = { fg = "#50fa7b", bg = "#44475a" }
progress_error  = { fg = "#f1fa8c", bg = "#ff5555" }

[which]
mask            = { bg = "#44475a" }
cand            = { fg = "#8be9fd" }
rest            = { fg = "#6272a4" }
desc            = { fg = "#ffb86c" }
separator       = " 󰁔 "
separator_style = { fg = "#6272a4" }

[confirm]
border   = { fg = "#ff79c6" }
title    = { fg = "#ff79c6" }
body     = { fg = "#f8f8f2" }
list     = { fg = "#f8f8f2" }
btn_yes  = { fg = "#282a36", bg = "#50fa7b", bold = true }
btn_no   = { fg = "#f8f8f2", bg = "#44475a" }

[spot]
border  = { fg = "#ff79c6" }
title   = { fg = "#ff79c6" }
tbl_col = { fg = "#ff79c6" }
tbl_cell = { fg = "#f8f8f2" }

[notify]
title_info  = { fg = "#50fa7b" }
title_warn  = { fg = "#ffb86c" }
title_error = { fg = "#ff5555" }

[pick]
border   = { fg = "#8be9fd" }
active   = { fg = "#282a36", bg = "#8be9fd" }
inactive = { fg = "#f8f8f2" }

[input]
border   = { fg = "#8be9fd" }
title    = { fg = "#8be9fd" }
value    = { fg = "#f8f8f2" }
selected = { bg = "#44475a" }

[cmp]
active   = { fg = "#282a36", bg = "#8be9fd", bold = true }
inactive = { fg = "#f8f8f2", bg = "#44475a" }

[tasks]
border  = { fg = "#8be9fd" }
title   = { fg = "#8be9fd" }
hovered = { fg = "#282a36", bg = "#f8f8f2" }

[help]
chord   = { fg = "#8be9fd" }
action  = { fg = "#ff79c6" }
hovered = { fg = "#282a36", bg = "#f8f8f2" }
